<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Self Attendance</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: radial-gradient(ellipse at top, #1a1a3a 0%, #0d0d20 60%, #050510 100%);
    min-height: 100vh;
    color: #e8e8f5;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: rgba(20, 20, 45, 0.55);
    border: 1px solid rgba(120, 130, 200, 0.25);
    border-radius: 22px;
    padding: 28px 22px 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  .title {
    font-size: 1.5rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: 6px;
  }
  .subtitle {
    text-align: center;
    color: #9aa0c0;
    font-size: 0.92rem;
    margin-bottom: 20px;
  }
  .timer {
    text-align: center;
    font-weight: 800;
    font-size: 1.1rem;
    color: #6ea8fe;
    background: rgba(30,40,80,0.5);
    border: 1px solid rgba(110,168,254,0.35);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 20px;
  }
  .timer.expired { color: #ff6b6b; border-color: rgba(255,107,107,0.4); }
  label.field-label {
    display: block;
    font-size: 0.88rem;
    color: #c0c4e0;
    margin-bottom: 8px;
  }
  input#passcodeInput {
    width: 100%;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-align: center;
    padding: 16px 14px;
    border-radius: 12px;
    border: 2px solid rgba(110,168,254,0.4);
    background: rgba(10,12,30,0.6);
    color: #fff;
    outline: none;
    text-transform: lowercase;
  }
  input#passcodeInput:focus { border-color: #6ea8fe; }
  .match-box {
    margin-top: 18px;
    border-radius: 14px;
    padding: 16px;
    background: rgba(30, 60, 45, 0.4);
    border: 1px solid rgba(56,217,169,0.4);
    display: none;
  }
  .match-box.show { display: block; }
  .match-name {
    font-size: 1.15rem;
    font-weight: 800;
    color: #7fffd4;
  }
  .match-rn { color: #9aa0c0; font-size: 0.8rem; margin-top: 2px; }
  .hint {
    margin-top: 12px;
    font-size: 0.82rem;
    color: #8a90b5;
    text-align: center;
    min-height: 18px;
  }
  .mark-btn {
    width: 100%;
    margin-top: 18px;
    padding: 15px;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 800;
    color: #06251b;
    background: linear-gradient(135deg, #38d9a9, #4f8ef7);
    cursor: pointer;
    display: none;
  }
  .mark-btn.show { display: block; }
  .mark-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .status-msg {
    margin-top: 16px;
    text-align: center;
    font-size: 0.9rem;
    padding: 12px;
    border-radius: 12px;
    display: none;
  }
  .status-msg.show { display: block; }
  .status-msg.success { background: rgba(56,217,169,0.15); color: #7fffd4; border: 1px solid rgba(56,217,169,0.35); }
  .status-msg.error { background: rgba(255,107,107,0.15); color: #ff9b9b; border: 1px solid rgba(255,107,107,0.35); }
  .status-msg.warn { background: rgba(251,191,36,0.15); color: #fcd34d; border: 1px solid rgba(251,191,36,0.35); }
  .footer-note {
    margin-top: 22px;
    font-size: 0.76rem;
    color: #7c82a8;
    text-align: center;
    line-height: 1.5;
  }
  .loading {
    text-align: center;
    color: #9aa0c0;
    padding: 40px 0;
  }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid rgba(110,168,254,0.25);
    border-top-color: #6ea8fe;
    border-radius: 50%;
    margin: 0 auto 14px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="loading" id="loadingBox">
    <div class="spinner"></div>
    Session load ho raha hai...
  </div>
</div>

<script>
const FIREBASE_DB_URL = "https://student-attendance-6d56b-default-rtdb.firebaseio.com";
const FIREBASE_API_KEY = "AIzaSyB0z8G5uIAKBRd6pDf1pOtX3Zkmt6hZjk8";

// ── Anonymous auth (same pattern as main app) ──
let _fbIdToken = null, _fbTokenExpiry = 0;
async function getFirebaseIdToken() {
  if (_fbIdToken && Date.now() < _fbTokenExpiry) return _fbIdToken;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem('tatu_fb_auth') || 'null'); } catch(e) {}
  const signUrl = 'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + FIREBASE_API_KEY;
  const refreshUrl = 'https://securetoken.googleapis.com/v1/token?key=' + FIREBASE_API_KEY;
  try {
    if (cached && cached.refreshToken) {
      const r = await fetch(refreshUrl, {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'grant_type=refresh_token&refresh_token=' + cached.refreshToken
      });
      const j = await r.json();
      if (j.id_token) {
        _fbIdToken = j.id_token;
        _fbTokenExpiry = Date.now() + (parseInt(j.expires_in) - 60) * 1000;
        return _fbIdToken;
      }
    }
    const r2 = await fetch(signUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true }) });
    const j2 = await r2.json();
    if (!j2.idToken) return null;
    localStorage.setItem('tatu_fb_auth', JSON.stringify({ refreshToken: j2.refreshToken }));
    _fbIdToken = j2.idToken;
    _fbTokenExpiry = Date.now() + (parseInt(j2.expiresIn) - 60) * 1000;
    return _fbIdToken;
  } catch(e) { return null; }
}

const params = new URLSearchParams(location.search);
const sessionId = params.get('s');
const dayIdx = params.get('d');
const regIdx = params.get('r');

let sessionData = null;
let matchedRn = null;
let timerInterval = null;

function esc(s) { return (s || '').toString().replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function normPass(v) {
  return (v || '').toString().trim().toLowerCase().replace(/\s+/g, '');
}

async function init() {
  const card = document.getElementById('card');
  if (!sessionId) {
    card.innerHTML = `<div class="status-msg error show">⚠️ Invalid link — session ID missing hai.</div>`;
    return;
  }
  try {
    const tok = await getFirebaseIdToken();
    const res = await fetch(`${FIREBASE_DB_URL}/sessions/${sessionId}.json?auth=${tok}`);
    sessionData = await res.json();
  } catch(e) {
    card.innerHTML = `<div class="status-msg error show">⚠️ Session load nahi ho payi. Internet check karo aur QR/link dobara try karo.</div>`;
    return;
  }
  if (!sessionData) {
    card.innerHTML = `<div class="status-msg error show">⚠️ Ye session expire ho chuka hai ya delete ho gaya hai.</div>`;
    return;
  }
  renderCard();
}

function renderCard() {
  const card = document.getElementById('card');
  card.innerHTML = `
    <div class="title">✅ Self Attendance</div>
    <div class="subtitle">Register ${(parseInt(regIdx) || 0) + 1} · Apna passcode daalo</div>
    <div class="timer" id="timerBox">⏱ --:--</div>
    <label class="field-label">Apna passcode daalo (jaise: ar91)</label>
    <input id="passcodeInput" type="text" maxlength="10" autocomplete="off" placeholder="ar91" />
    <div class="hint" id="hintMsg"></div>
    <div class="match-box" id="matchBox">
      <div class="match-name" id="matchName"></div>
      <div class="match-rn" id="matchRn"></div>
    </div>
    <button class="mark-btn" id="markBtn">📍 Location Allow Karke Mark Karo</button>
    <div class="status-msg" id="statusMsg"></div>
    <div class="footer-note">Attendance mark karne ke liye location dena zaroori hai. Ye sirf isi session ke liye use hoti hai.</div>
  `;

  startTimer();

  const input = document.getElementById('passcodeInput');
  input.addEventListener('input', onPasscodeInput);
  document.getElementById('markBtn').addEventListener('click', markAttendance);
}

function startTimer() {
  const timerBox = document.getElementById('timerBox');
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const remaining = (sessionData.expires || 0) - Date.now();
    if (remaining <= 0) {
      timerBox.textContent = '⏱ Session Expired';
      timerBox.classList.add('expired');
      clearInterval(timerInterval);
      const input = document.getElementById('passcodeInput');
      if (input) input.disabled = true;
      const btn = document.getElementById('markBtn');
      if (btn) btn.disabled = true;
      return;
    }
    const mins = Math.floor(remaining / 60000);
    const secs = Math.floor((remaining % 60000) / 1000);
    timerBox.textContent = `⏱ ${mins}:${secs.toString().padStart(2,'0')}`;
  }, 1000);
}

function onPasscodeInput(e) {
  const val = normPass(e.target.value);
  const matchBox = document.getElementById('matchBox');
  const markBtn = document.getElementById('markBtn');
  const hintMsg = document.getElementById('hintMsg');
  matchedRn = null;
  matchBox.classList.remove('show');
  markBtn.classList.remove('show');
  hintMsg.textContent = '';

  if (!val) return;

  const students = sessionData.students || {};
  const matches = Object.entries(students).filter(([rn, s]) => {
    const code = normPass(s.passcode || s.mobile || '');
    return code && code === val;
  });

  if (matches.length === 1) {
    const [rn, s] = matches[0];
    matchedRn = rn;
    document.getElementById('matchName').textContent = '👤 ' + s.name;
    document.getElementById('matchRn').textContent = 'Roll No. ' + (parseInt(rn) + 1);
    matchBox.classList.add('show');
    markBtn.classList.add('show');
  } else if (matches.length > 1) {
    hintMsg.textContent = '⚠️ Ye passcode ek se zyada students se match ho raha hai — admin se sampark karo.';
  } else {
    hintMsg.textContent = 'Sahi passcode daalo — apne naam ke pehle aur aakhri letter + 91.';
  }
}

function markAttendance() {
  if (!matchedRn) return;
  const btn = document.getElementById('markBtn');
  const statusMsg = document.getElementById('statusMsg');
  btn.disabled = true;
  btn.textContent = '📍 Location le rahe hain...';

  if (!navigator.geolocation) {
    showStatus('error', '⚠️ Ye browser location support nahi karta. Attendance mark nahi ho sakti.');
    btn.disabled = false;
    btn.textContent = '📍 Location Allow Karke Mark Karo';
    return;
  }

  navigator.geolocation.getCurrentPosition(async (pos) => {
    const loc = {
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      accuracy: pos.coords.accuracy,
      ts: Date.now()
    };
    await submitResponse(loc);
  }, (err) => {
    showStatus('error', '⚠️ Location allow nahi hui. Attendance mark karne ke liye location zaroori hai — permission allow karke dobara try karo.');
    btn.disabled = false;
    btn.textContent = '📍 Location Allow Karke Mark Karo';
  }, { enableHighAccuracy: true, timeout: 10000 });
}

async function submitResponse(loc) {
  const btn = document.getElementById('markBtn');
  try {
    const tok = await getFirebaseIdToken();
    await fetch(`${FIREBASE_DB_URL}/sessions/${sessionId}/responses/${matchedRn}.json?auth=${tok}`, {
      method: 'PUT',
      body: JSON.stringify({ location: loc, ts: Date.now() })
    });
    showStatus('success', '✅ Attendance mark ho gayi! Aap ab is page ko band kar sakte ho.');
    document.getElementById('passcodeInput').disabled = true;
    btn.style.display = 'none';
  } catch(e) {
    showStatus('error', '⚠️ Kuch galat ho gaya, internet check karke dobara try karo.');
    btn.disabled = false;
    btn.textContent = '📍 Location Allow Karke Mark Karo';
  }
}

function showStatus(type, msg) {
  const el = document.getElementById('statusMsg');
  el.className = 'status-msg show ' + type;
  el.textContent = msg;
}

init();
</script>
</body>
</html>
